global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: [alertname, probe, site]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: REPLACE_WITH_BOT_TOKEN
        chat_id: 123456789
        send_resolved: true
        parse_mode: HTML
